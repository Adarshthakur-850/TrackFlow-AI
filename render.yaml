services:
  # Backend Web Service (FastAPI + ML Models)
  - type: web
    name: trackflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python ml/train_models.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEPHONY_SANDBOX
        value: "True"
      - key: SMS_SANDBOX
        value: "True"
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site (React + Vite + Tailwind)
  - type: web
    name: trackflow-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
