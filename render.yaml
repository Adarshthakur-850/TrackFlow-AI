services:
  - type: web
    name: trackflow-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python ml/train_models.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEPHONY_SANDBOX
        value: "True"
      - key: SMS_SANDBOX
        value: "True"
      - key: SECRET_KEY
        generateValue: true
